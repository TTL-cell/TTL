<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zero-shot TTS Demo</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <header class="page">
    <div class="header">
      <h1>Zero-shot TTS Demo</h1>
      <p class="subtitle">
        Compare audio across different sampling methods: <b>GT</b>, <b>baseline</b>, <b>phoneme</b>, <b>TTL</b>
      </p>
    </div>
  </header>

  <main class="page">
    <section class="tableWrap">
      <table class="demoTable" id="demoTable">
        <thead>
          <tr>
            <th class="colDataset">Dataset</th>
            <th class="colMethod">GT</th>
            <th class="colMethod">baseline</th>
            <th class="colMethod">phoneme</th>
            <th class="colMethod">TTL</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="static/js/app.js"></script>
</body>
</html>
